name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Tests/GarminAchievements.Tests.csproj

      - name: Build
        run: dotnet build Tests/GarminAchievements.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/GarminAchievements.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/Tests/TestResults/*.trx

  # Builds the server image on every push/PR; on main (and v* tags) also publishes it to
  # ghcr.io/<owner>/watchcrawler-server, which is what setup.sh deploys - users never build .NET.
  # One-time: after the first publish, make the package public (GitHub > Packages > watchcrawler-server
  # > Package settings > Change visibility), or users' Fly deploys can't pull it.
  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    needs: server-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/watchcrawler-server" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          docker build ./server
          --build-arg BUILD_STAMP=${GITHUB_SHA::7}
          -t ${{ steps.img.outputs.name }}:latest
          -t ${{ steps.img.outputs.name }}:${GITHUB_SHA::7}

      - name: Publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${{ steps.img.outputs.name }}:latest
          docker push ${{ steps.img.outputs.name }}:${GITHUB_SHA::7}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag ${{ steps.img.outputs.name }}:latest ${{ steps.img.outputs.name }}:${GITHUB_REF_NAME}
            docker push ${{ steps.img.outputs.name }}:${GITHUB_REF_NAME}
          fi

  # The Connect IQ SDK requires an interactive EULA click-through via
  # Garmin's SDK Manager (no scriptable, licensable download URL), so the
  # watch app can't be compiled in a hosted CI runner. This job is a
  # placeholder documenting that; watch changes are verified locally in the
  # Connect IQ simulator (see watch/README or the project plan) before push.
  watch-note:
    name: Watch app (not CI-buildable - see comments)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Connect IQ SDK needs an interactive EULA acceptance via Garmin's SDK Manager,"
          echo "so the watch app isn't compiled here. Verify locally with monkeyc + the simulator"
          echo "before pushing changes under watch/."
