# Run the WatchCrawler server on your own machine instead of Fly.io.
#   1. setup.sh writes .env for you (or: copy server/.env.example to .env and fill it in)
#   2. docker compose up -d
#   3. The watch only talks HTTPS, so expose it with a tunnel, e.g.:
#        cloudflared tunnel --url http://localhost:8080
#      and use the https://....trycloudflare.com address it prints.
services:
  watchcrawler:
    image: ghcr.io/yohananha/watchcrawler-server:latest
    # To build from this checkout instead: comment out `image` and uncomment:
    # build: ./server
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
