# Fly.io deploy config. Edit `app` to a globally-unique name, then:
#   fly auth login
#   fly apps create <your-app-name>
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-... WATCH_SHARED_KEY=<a random string>
#   fly deploy
# See server/README.md for the full walkthrough.

app = "watchcrawler"
primary_region = "iad"               # pick the region closest to you

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"        # scales to zero when idle - fine for
  auto_start_machines = true         # ~5-10 events/day, first request after
  min_machines_running = 0           # idle takes a few extra seconds to wake

[env]
  PORT = "8080"
  # Remote test trigger (arming page + watch polling). Set to "false" or
  # remove once you are done testing achievements.
  ENABLE_TEST_TRIGGER = "true"
  # The remote test trigger's armed flag is a file on this volume, not
  # process memory - Fly wipes memory on every idle stop, which silently
  # lost armed triggers. Create once: fly volumes create trigger_data
  # --region iad --size 1 --app watchcrawler
  TRIGGER_STATE_PATH = "/data/trigger.flag"

[mounts]
  source = "trigger_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
