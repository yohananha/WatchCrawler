# Fly.io deploy config. You don't need to edit this: `./setup.sh` (or setup.ps1)
# creates the app, the volume and the secrets, then deploys the prebuilt image:
#   fly deploy --app <your-app> --image ghcr.io/yohananha/watchcrawler-server:latest
# The app name is always passed on the command line, so the one below is just a default.
# Secrets (never put them in this file): ANTHROPIC_API_KEY or DEEPSEEK_API_KEY,
# WATCH_SHARED_KEY, and optionally LLM_PROVIDER, CREDIT_BALANCE_USD, USER_NTFY_URL, REPORT_ERRORS.

app = "watchcrawler"
primary_region = "iad"               # setup asks; pick the region closest to you

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"        # scales to zero when idle - fine for
  auto_start_machines = true         # ~5-10 events/day, first request after
  min_machines_running = 0           # idle takes a few extra seconds to wake

[env]
  PORT = "8080"
  # Remote test trigger (arming page + watch polling), developer builds only.
  ENABLE_TEST_TRIGGER = "false"
  # State kept across idle stops (Fly wipes memory then): install id, usage/credit,
  # error-report counters, "do not repeat recent jokes" history, test-trigger flag.
  DATA_DIR = "/data"
  TRIGGER_STATE_PATH = "/data/trigger.flag"
  HISTORY_STATE_PATH = "/data/history.json"
  # Daily events (hours 0-23 in the watch's local time). The watch picks these up
  # on its next settings poll, no reinstall: edit here + `fly deploy`.
  DAY_QUIET_FROM = "23"
  DAY_QUIET_TO = "7"
  DAY_MAX_PER_DAY = "10"
  DAY_IDLE_HOUR = "22"
  DAY_GOAL_HOUR = "21"

[mounts]
  source = "trigger_data"            # historical name, kept so existing deploys keep their data
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
